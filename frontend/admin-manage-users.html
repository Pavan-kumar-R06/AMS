    <meta charset="UTF-8">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <i class="fas fa-bars"></i>
</button>

<aside class="sidebar">

    <div class="sidebar-header">
        <h2>AMS Admin</h2>
    </div>

    <nav class="sidebar-nav">
        <ul>

            <li>
                <a href="admin-dashboard.html">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="admin-manage-flats.html">
                    <i class="fas fa-building"></i>
                    Manage Flats
                </a>
            </li>

            <li>
                <a href="admin-manage-owners.html">
                    <i class="fas fa-users"></i>
                    Manage Owners
                </a>
            </li>

            <li>
                <a href="admin-manage-staff.html">
                    <i class="fas fa-user-tie"></i>
                    Manage Staff
                </a>
            </li>

            <li>
                <a href="#" class="active">
                    <i class="fas fa-user-shield"></i>
                    Manage Users
                </a>
            </li>

            <li>
                <a href="admin-manage-parking.html">
                    <i class="fas fa-car"></i>
                    Manage Parking
                </a>
            </li>

            <li>
                <a href="admin-manage-requests.html">
                    <i class="fas fa-tools"></i>

                    <i class="fas fa-sign-out-alt"></i>

                </a>
            </li>

        </ul>
    </nav>

</aside>

<div class="main-content">

    <div class="header">
        <h1>Manage Users</h1>
    </div>

    <div class="content">

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">

                    <tr>

                        <td colspan="3" class="loading">

                            <div class="spinner"></div>

                            <span>Loading Users...</span>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Reset Password Modal -->

<!-- Create Login Modal -->
<div class="modal" id="passwordModal" style="display:none;">
    <div class="modal-content" style="max-width:450px;">

        <div class="modal-header">
            <h2>Create Login</h2>
        </div>

        <div class="modal-body">

            <form id="passwordForm">

                <input type="hidden" id="role">
                <input type="hidden" id="ownerId">
                <input type="hidden" id="staffId">

                <div class="form-group">
                    <label>Username</label>
                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        required>
                </div>
<div class="form-group">

    <label>Password</label>

    <div class="password-wrapper">

        <input
            type="password"
            id="loginPassword"
            class="form-control">

        <i
            class="fas fa-eye toggle-password"
            data-target="loginPassword">
        </i>

    </div>

</div>

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelPasswordBtn"
                        class="btn btn-cancel">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Create Login

                    </button>

                </div>

            </form>

        </div>

    </div>
</div>
<div id="toastContainer" class="toast-container"></div>
<script src="js/password-toggle.js"></script>
<script src="js/manage-users.js"></script>

</body>

</html>
